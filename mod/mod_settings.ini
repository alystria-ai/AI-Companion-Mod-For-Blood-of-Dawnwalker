[Mod]
Id = DawnwalkerConvai
Name = LLM NPC Companions System
Version = 0.5.4
Description = Conversations, companions, first-person POV, Horde battles and appearance colours. Open the full menu with F5 or your remapped shortcut.
Author = Alystria AI
ModURL = https://github.com/alystria-ai/AI-Companion-Mod-For-Blood-of-Dawnwalker

[Setting.FollowerCloseness]
Id = FollowerCloseness
Type = percent
Label = Follower closeness
Description = Higher values bring the formation closer to Coen. Applies on the next real follow; minimum body clearance is preserved.
Group = Following
Minimum = 50
Maximum = 150
Step = 5
Default = 100
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = FollowerCloseness

[Setting.PartySpacing]
Id = PartySpacing
Type = percent
Label = Party spacing
Description = Lower values make the party tighter; higher values spread companions out. Applies on the next real follow; character size sets the minimum clearance.
Group = Following
Minimum = 75
Maximum = 175
Step = 5
Default = 100
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = PartySpacing

[Setting.NarrowFormation]
Id = NarrowFormation
Type = toggle
Label = Narrow formation
Description = Prefer a narrower, deeper group behind Coen. Large parties gain extra columns rather than a long single-file tail. Applies on the next real follow.
Group = Following
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = NarrowFormation

[Setting.DamagePercent]
Id = DamagePercent
Type = percent
Label = Companion damage
Description = Scale owned companion physical strength, including ordinary attacks against NPCs.
Group = Combat
Minimum = 0
Maximum = 500
Step = 10
Default = 250
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = DamagePercent

[Setting.AttackFrequency]
Id = AttackFrequency
Type = percent
Label = Attack frequency
Description = Native attack rate. Does not force attacks or change native ability choice.
Group = Combat
Minimum = 50
Maximum = 250
Step = 10
Default = 180
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = AttackFrequency

[Setting.AncaRomance]
Id = AncaRomance
Type = picker
Label = Anca romance profile
Description = Auto follows romance progress in your save. On always uses the romance profile; Off always uses the normal profile.
Group = Conversations
PresetValues = 0|1|-1
PresetLabels = Auto|On|Off
Default = 0
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = AncaRomance

[Setting.LacraRomance]
Id = LacraRomance
Type = picker
Label = Lacra romance profile
Description = Auto follows romance progress in your save. On always uses the romance profile; Off always uses the normal profile.
Group = Conversations
PresetValues = 0|1|-1
PresetLabels = Auto|On|Off
Default = 0
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = LacraRomance

[Setting.FollowUpQuestions]
Id = FollowUpQuestions
Type = toggle
Label = Follow-up questions
Description = Normally end with one natural follow-up question; skip it when there is a clear reason. Only the last group speaker asks Coen. Applies to new replies and never starts the microphone automatically.
Group = Conversations
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = FollowUpQuestions

[Setting.TransparentChatHud]
Id = TransparentChatHud
Type = toggle
Label = Transparent chat HUD
Description = Make subtitles, voice status and the typing field transparent. Turn Off to restore the shaded panel.
Group = Conversations
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = TransparentChatHud

[Setting.HideChatBoxes]
Id = HideChatBoxes
Type = toggle
Label = Hide chat boxes
Description = On hides all conversation text, leaving only a microphone indicator during voice input. Text entry closes after sending. Overrides NPC subtitles.
Group = Conversations
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = HideChatBoxes

[Setting.ShowNpcSubtitles]
Id = ShowNpcSubtitles
Type = toggle
Label = NPC subtitles
Description = Show subtitles for mod NPC replies. Hide chat boxes takes priority.
Group = Conversations
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = ShowNpcSubtitles

[Setting.ChatHudBottomOffset]
Id = ChatHudBottomOffset
Type = percent
Label = Chat HUD bottom offset
Description = Extra height above the original HUD position. Zero keeps the current placement; higher values move text input, subtitles, voice indicators and Horde countdowns up together. Uses a percentage of screen height.
Group = Conversations
Minimum = 0
Maximum = 40
Step = 1
Default = 0
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = ChatHudBottomOffset

[Setting.FirstPersonCamera]
Id = FirstPersonCamera
Type = toggle
Label = First-person camera
Description = Experimental head-height gameplay camera. Native dialogue and cutscene cameras take priority.
Group = Camera
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = FirstPersonCamera

[Setting.FirstPersonFOV]
Id = FirstPersonFOV
Type = integer
Label = First-person field of view
Description = Horizontal field of view for the mod camera only. Applies live.
Group = Camera
Minimum = 60
Maximum = 120
Step = 5
Default = 90
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = FirstPersonFOV

[Setting.FirstPersonHeight]
Id = FirstPersonHeight
Type = integer
Label = Camera height offset
Description = Height relative to Coen’s native eye position, in centimetres. Applies live.
Group = Camera
Minimum = -20
Maximum = 20
Step = 2
Default = 0
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = FirstPersonHeight

[Setting.FirstPersonForward]
Id = FirstPersonForward
Type = integer
Label = Camera forward offset
Description = Distance ahead of Coen’s capsule, in centimetres. Applies live.
Group = Camera
Minimum = 20
Maximum = 70
Step = 2
Default = 42
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = FirstPersonForward

[Setting.GazeHorizontal]
Id = GazeHorizontal
Type = integer
Label = Companion gaze horizontal
Description = First-person gaze offset in centimetres. Positive looks toward your right; negative toward your left. Zero targets the camera centre.
Group = Camera
Minimum = -20
Maximum = 20
Step = 1
Default = 5
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = GazeHorizontal

[Setting.GazeVertical]
Id = GazeVertical
Type = integer
Label = Companion gaze vertical
Description = First-person gaze offset in centimetres. Positive looks up; negative looks down relative to your view. Zero targets the camera centre.
Group = Camera
Minimum = -20
Maximum = 20
Step = 1
Default = -1
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = GazeVertical

[Setting.AnytimeAbilities]
Id = AnytimeAbilities
Type = toggle
Label = Day and night abilities
Description = Allow learned human and vampire active abilities at either time of day. Costs and skill unlocks remain unchanged. Off restores native restrictions.
Group = Player
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = AnytimeAbilities

[Setting.AmbientComments]
Id = AmbientComments
Type = toggle
Label = React to Coen observations
Description = Nearby companions respond after Coen finishes a solo exploration observation, without a random roll and with at least three minutes between reactions. Excludes conversations with other characters, combat, cutscenes and your own chat.
Group = Conversations
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = AmbientComments

[Setting.SlotlessPassives]
Id = SlotlessPassives
Type = toggle
Label = Passives without slots
Description = Activate learned passive skills without assigning slots. Does not unlock skills or change saved quickslots. Off restores normal equipment rules.
Group = Player
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = SlotlessPassives

[Setting.AutoLoot]
Id = AutoLoot
Type = toggle
Label = Auto-loot nearby items
Description = Collect nearby free loot, herbs and resources outside combat. Skips locks, theft and items behind walls. Respects inventory limits.
Group = Player
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = AutoLoot

[Setting.LootComments]
Id = LootComments
Type = toggle
Label = React to collected loot
Description = One random companion may comment on a completed loot batch. Ten-minute ordinary cooldown; newly acquired Unique equipment has a separate two-minute cooldown. Storage withdrawals stay silent.
Group = Conversations
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = LootComments

[Setting.SkillsAnywhere]
Id = SkillsAnywhere
Type = toggle
Label = Spend skill points anywhere
Description = Buy skills through the normal Skills page without a roadshrine. Keeps native costs, prerequisites and quest locks.
Group = Player
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = SkillsAnywhere

[Setting.FastTravelAnywhere]
Id = FastTravelAnywhere
Type = toggle
Label = Fast travel from anywhere
Description = Use the normal map to travel without a roadshrine. Hover other map icons or custom waypoints and press F once for Travel here. Shows the native loading screen while loading the destination and checking standing room. Outside combat and cutscenes only.
Group = Player
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = FastTravelAnywhere
