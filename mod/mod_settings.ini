[Mod]
Id = DawnwalkerConvai
Name = LLM NPC Companions System
Version = 0.5.0
Description = Conversations and travelling companions. Open the native party menu with its configured shortcut (F5 by default).

[Setting.DamagePercent]
Id = DamagePercent
Type = percent
Label = Companion damage
Description = Scale owned companion physical strength, including ordinary attacks against NPCs.
Group = Combat
Minimum = 0
Maximum = 500
Step = 10
Default = 250
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = DamagePercent

[Setting.AttackFrequency]
Id = AttackFrequency
Type = percent
Label = Attack frequency
Description = Native attack rate. Does not force attacks or change native ability choice.
Group = Combat
Minimum = 50
Maximum = 250
Step = 10
Default = 180
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = AttackFrequency

[Setting.AncaRomance]
Id = AncaRomance
Type = toggle
Label = Anca romance profile
Description = Enable romantic conversations early. The mod also enables this profile automatically when the loaded save confirms romance with Anca.
Group = Conversations
Default = 0
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = AncaRomance

[Setting.LacraRomance]
Id = LacraRomance
Type = toggle
Label = Lacra romance profile
Description = Enable romantic conversations early. The mod also enables this profile automatically when the loaded save confirms romance with Lacra.
Group = Conversations
Default = 0
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = LacraRomance

[Setting.FirstPersonCamera]
Id = FirstPersonCamera
Type = toggle
Label = First-person camera
Description = Experimental head-height gameplay camera. Native dialogue and cutscene cameras take priority.
Group = Camera
Default = 0
ConfigFile = config.ini
ConfigSection = Companions
ConfigKey = FirstPersonCamera
